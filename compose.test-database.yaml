name: bite-tech-pos-test-database

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: restaurant_pos_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: validation-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restaurant_pos_test"]
      interval: 2s
      timeout: 2s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data