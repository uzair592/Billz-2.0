name: PostgreSQL Validation

on:
  push:
    branches: [main, feat/milestone-13-production-pilot]
  pull_request:
    branches: [main]

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run browser tests
        run: npx playwright test

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: restaurant_pos_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: validation-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d restaurant_pos_test"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        shell: bash
        run: |
          mapfile -t unit_tests < <(find tests -maxdepth 1 -name '*.test.mjs' \
            ! -name 'billing-postgres.test.mjs' \
            ! -name 'refund-sales-report-postgres.test.mjs' \
            ! -name 'server-startup.test.mjs' | sort)
          node --test "${unit_tests[@]}"

      - name: Wait for PostgreSQL
        run: |
          for attempt in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres -d restaurant_pos_test; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL (attempt $attempt/30)..."
            sleep 2
          done
          echo "PostgreSQL failed to start"
          exit 1

      - name: Apply migrations
        run: |
          test "$(find database/migrations -maxdepth 1 -name '*.sql' | wc -l)" -eq 11
          export PGPASSWORD=validation-only
          for migration in database/migrations/*.sql; do
            echo "Applying $migration"
            psql -h localhost -U postgres -d restaurant_pos_test -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Run migration runner tests
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://postgres:validation-only@localhost:5432/restaurant_pos_test
        run: node --test tests/migration-runner.test.mjs

      - name: Run production configuration tests
        run: node --test tests/production-config.test.mjs

      - name: Run health endpoint tests
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://postgres:validation-only@localhost:5432/restaurant_pos_test
        run: node --test tests/health-endpoints.test.mjs

      - name: Run bootstrap CLI tests
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://postgres:validation-only@localhost:5432/restaurant_pos_test
        run: node --test tests/bootstrap-first-restaurant.test.mjs

      - name: Run graceful shutdown tests
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://postgres:validation-only@localhost:5432/restaurant_pos_test
        run: node --test tests/graceful-shutdown.test.mjs

      - name: Run backup and restore tests
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://postgres:validation-only@localhost:5432/restaurant_pos_test
        run: node --test tests/backup-restore.test.mjs

      - name: Run integration tests
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://postgres:validation-only@localhost:5432/restaurant_pos_test
          TEST_DATABASE_URL: postgresql://pos_integration_app:integration-only@localhost:5432/restaurant_pos_test
        shell: bash
        run: |
          set -o pipefail
          npm run test:integration | tee /tmp/postgres-tests.tap
          if grep -Eq '# SKIP|^# skipped [1-9]' /tmp/postgres-tests.tap; then
            echo "Required PostgreSQL tests were skipped"
            exit 1
          fi

      - name: Validate migrations in clean PostgreSQL 17
        run: npm run validate:database

      - name: Run Linux startup test
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://postgres:validation-only@localhost:5432/restaurant_pos_test
        run: node --test tests/server-startup.test.mjs

      - name: Validate workflow YAML
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest

      - name: Check committed feature diff
        shell: bash
        run: |
          git rev-parse --verify origin/main
          merge_base="$(git merge-base HEAD origin/main)"
          echo "Checking committed diff: $merge_base..HEAD"
          git diff --check "$merge_base..HEAD"
          git diff --check

      - name: Scan full feature delta for secrets
        shell: bash
        run: |
          merge_base="$(git merge-base HEAD origin/main)"
          scan_range="$merge_base..HEAD"
          echo "Scanning Gitleaks commit range: $scan_range"
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --verbose --log-opts="$scan_range" /repo

      - name: Verify working tree clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree is not clean"
            git status
            exit 1
          fi
          echo "Working tree is clean"

  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SMOKE_DB: restaurant_pos_smoke
      SMOKE_USER: pos_smoke
      SMOKE_PASSWORD: smoke-only
      SMOKE_PEPPER: smoke-pepper-at-least-16-chars
      SMOKE_SESSION: smoke-session-secret-at-least-16
      SMOKE_OWNER_PASSWORD: smoke-password-12345

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: restaurant_pos_smoke
          POSTGRES_USER: pos_smoke
          POSTGRES_PASSWORD: smoke-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pos_smoke -d restaurant_pos_smoke"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: bite-tech-pos:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Confirm image runs as non-root
        run: |
          docker run --rm --entrypoint sh bite-tech-pos:smoke -c 'id -u' | grep -v '^0$'

      - name: Apply migrations through the runner
        env:
          DATABASE_URL: postgresql://${{ env.SMOKE_USER }}:${{ env.SMOKE_PASSWORD }}@localhost:5432/${{ env.SMOKE_DB }}
          MIGRATIONS_DIR: /app/database/migrations
        run: |
          docker run --rm \
            -e DATABASE_URL \
            -e MIGRATIONS_DIR \
            --network host \
            --entrypoint node \
            bite-tech-pos:smoke \
            src/server/database/migration-runner.mjs

      - name: Bootstrap the first restaurant
        env:
          DATABASE_URL: postgresql://${{ env.SMOKE_USER }}:${{ env.SMOKE_PASSWORD }}@localhost:5432/${{ env.SMOKE_DB }}
          PASSWORD_PEPPER: ${{ env.SMOKE_PEPPER }}
          RESTAURANT_NAME: Pilot Restaurant
          RESTAURANT_SLUG: pilot-restaurant
          RESTAURANT_TIMEZONE: Asia/Karachi
          RESTAURANT_CURRENCY: PKR
          OWNER_EMAIL: owner@pilot.example
          OWNER_DISPLAY_NAME: Pilot Owner
          BOOTSTRAP_OWNER_PASSWORD: ${{ env.SMOKE_OWNER_PASSWORD }}
          SUBSCRIPTION_STATUS: trial
        run: |
          docker run --rm \
            -e DATABASE_URL \
            -e PASSWORD_PEPPER \
            -e RESTAURANT_NAME \
            -e RESTAURANT_SLUG \
            -e RESTAURANT_TIMEZONE \
            -e RESTAURANT_CURRENCY \
            -e OWNER_EMAIL \
            -e OWNER_DISPLAY_NAME \
            -e BOOTSTRAP_OWNER_PASSWORD \
            -e SUBSCRIPTION_STATUS \
            --network host \
            --entrypoint node \
            bite-tech-pos:smoke \
            src/server/bootstrap-first-restaurant.mjs

      - name: Start the production container
        env:
          # The production-built image is exercised here. NODE_ENV is
          # development for the CI smoke run only, because the runner
          # has no real HTTPS origin; a real deployment sets
          # NODE_ENV=production and an HTTPS TRUSTED_ORIGINS value.
          NODE_ENV: development
          DATABASE_URL: postgresql://${{ env.SMOKE_USER }}:${{ env.SMOKE_PASSWORD }}@localhost:5432/${{ env.SMOKE_DB }}
          TRUSTED_ORIGINS: http://localhost:3000
          SESSION_SECRET: ${{ env.SMOKE_SESSION }}
          PASSWORD_PEPPER: ${{ env.SMOKE_PEPPER }}
          PAYMENT_PROVIDER: manual
          LOG_LEVEL: info
          PORT: "3000"
          HOST: 0.0.0.0
        run: |
          docker run -d --name pos-smoke \
            -e NODE_ENV \
            -e DATABASE_URL \
            -e TRUSTED_ORIGINS \
            -e SESSION_SECRET \
            -e PASSWORD_PEPPER \
            -e PAYMENT_PROVIDER \
            -e LOG_LEVEL \
            -e PORT \
            -e HOST \
            -p 3000:3000 \
            --network host \
            bite-tech-pos:smoke

      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health/ready; then
              echo "Application is ready"
              exit 0
            fi
            echo "Waiting for readiness (attempt $attempt/30)..."
            sleep 2
          done
          echo "Application did not become ready"
          docker logs pos-smoke
          exit 1

      - name: Verify liveness and readiness
        run: |
          echo "Liveness:"
          curl -fsS http://localhost:3000/health/live
          echo ""
          echo "Readiness:"
          curl -fsS http://localhost:3000/health/ready
          echo ""

      - name: Load the POS page
        run: |
          curl -fsS http://localhost:3000/ | grep -q "Fast Food POS\|bite\|POS" || \
            curl -fsS http://localhost:3000/ | head -c 200

      - name: Verify an unauthenticated protected endpoint is rejected
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            http://localhost:3000/api/auth/me)
          echo "Unauthenticated /api/auth/me returned $status"
          if [ "$status" != "401" ]; then
            echo "Expected 401 for an unauthenticated protected endpoint, got $status"
            exit 1
          fi

      - name: Verify an invalid Stripe webhook is rejected
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "content-type: application/json" \
            -H "x-billing-signature: t=1,v1=invalid" \
            --data '{}' \
            http://localhost:3000/webhook)
          echo "Invalid webhook returned $status"
          if [ "$status" = "200" ]; then
            echo "An invalid webhook must not be accepted"
            exit 1
          fi

      - name: Send SIGTERM
        run: |
          docker kill --signal=SIGTERM pos-smoke

      - name: Confirm clean shutdown
        run: |
          for attempt in $(seq 1 15); do
            if ! docker ps --format '{{.Names}}' | grep -q '^pos-smoke$'; then
              echo "Container exited cleanly after $attempt checks"
              exit 0
            fi
            sleep 2
          done
          echo "Container did not stop after SIGTERM"
          docker logs pos-smoke
          exit 1

      - name: Cleanup
        if: always()
        run: |
          docker rm -f pos-smoke || true
